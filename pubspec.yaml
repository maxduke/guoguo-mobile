name: guoguo_mobile
description: 果果 — 随时接着看，独立运行的短剧应用。
publish_to: none
version: 0.20.7+61
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  guoguo_core:
    path: packages/guoguo_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The scoped Dart/iOS corrections are checked against this exact source version.
  better_player_plus: 1.4.1
  wakelock_plus: ^1.7.0
  background_downloader: ^9.6.1
  cached_network_image: ^3.4.1
  # 7.1+ requires Xcode 26.1.1; keep compatible with the macos-15 builder.
  connectivity_plus: 7.0.0
  file_picker: ^13.0.0
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  http: ^1.6.0
  path: ^1.9.1
  ffmpeg_kit_flutter_new_full: ^2.5.2
  # Cast load awaits the verified 1.4.8 platform channel contract.
  flutter_chrome_cast: 1.4.8
  xml: ^7.0.1
  flutter_cache_manager: ^3.4.2
  package_info_plus: ^10.2.1
dependency_overrides:
  # Generated and hash-verified by scripts/prepare_player.py before pub get.
  better_player_plus:
    path: .dart_tool/player/better_player_plus
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
