  http: ^1.6.0
  path: ^1.9.1
  ffmpeg_kit_flutter_new_full: ^2.5.2
  flutter_chrome_cast: ^1.4.8
  xml: ^7.0.1
  flutter_cache_manager: ^3.4.2
  package_info_plus: ^10.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
