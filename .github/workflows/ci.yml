name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    name: Flutter and core checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release tooling
        run: |
          python3 scripts/release.py validate
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/core/go.sum
      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/guoguo_core/lib
      - run: flutter analyze
      - name: Install media regression tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: flutter test --concurrency=2
        env:
          GUOGUO_FFMPEG: ffmpeg
      - run: go test ./...
        working-directory: native/core
  ios:
    name: iOS unsigned build
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/core/go.sum
      - run: scripts/setup_core.sh
      - run: scripts/build_core.sh ios
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Prepare linked media libraries
        run: scripts/prepare_ios_media.sh
      - run: flutter build ios --release --no-codesign
      - name: Package and verify app version
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: Guoguo-iOS-unsigned
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Guoguo-iOS-unsigned
          path: release-assets
      - name: Verify release artifacts
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py validate
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "果果 $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
