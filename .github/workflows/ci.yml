name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checks-only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    name: Flutter and core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release tooling
        run: |
          python3 scripts/release.py validate
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/core/go.sum
      - name: Lint GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python3 scripts/prepare_player.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/guoguo_core/lib
      - run: flutter analyze
      - name: Install media and UI regression tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: flutter test --concurrency=2
        env:
          GUOGUO_FFMPEG: ffmpeg
          GUOGUO_PREVIEW_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          GUOGUO_ICON_FONT: ${{ env.FLUTTER_ROOT }}/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf
          GUOGUO_PERF_OUTPUT: ${{ runner.temp }}/guoguo-performance.json
      - run: go test ./...
        working-directory: native/core
  ios:
    name: iOS unsigned build
    if: ${{ !inputs.checks-only }}
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-ios
      - uses: actions/upload-artifact@v4
        id: development-artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: Guoguo-iOS-unsigned
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Report unavailable development download
        if: steps.development-artifact.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::The build and package verification passed, but the optional development download could not be stored. See the upload step for the cause.'
          echo 'The optional development IPA download is unavailable. The build and package verification passed; Release publishes its verified package directly.' >> "$GITHUB_STEP_SUMMARY"
  android:
    name: Android phone and TV build
    if: ${{ !inputs.checks-only }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-android
      - uses: actions/upload-artifact@v4
        id: android-artifact
        continue-on-error: true
        with:
          name: Guoguo-Android-test
          path: build/android-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Report unavailable development APK
        if: steps.android-artifact.outcome == 'failure'
        run: echo 'Android package verification passed, but the optional test APK download could not be stored.' >> "$GITHUB_STEP_SUMMARY"
