name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      checks-only: true
  release:
    name: Build and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: macos-15
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-ios
      - name: Prepare Android release signing
        if: vars.ANDROID_RELEASE_ENABLED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'guoguo-release.jks'
          with path.open('wb', opener=lambda p, flags: os.open(p, flags, 0o600)) as output:
              output.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'GUOGUO_ANDROID_KEYSTORE={path}\n')
          PY
      - uses: ./.github/actions/build-android
        if: vars.ANDROID_RELEASE_ENABLED == 'true'
        with:
          mode: release
        env:
          GUOGUO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GUOGUO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GUOGUO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
      - name: Include verified Android package
        if: vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        run: cp build/android-package/* build/release/
      - name: Remove temporary signing material
        if: always() && vars.ANDROID_RELEASE_ENABLED == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/guoguo-release.jks"
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py validate
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "果果 $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
