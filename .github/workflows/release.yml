name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download verified main build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py validate
          run_id=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No successful main CI for $GITHUB_SHA. Wait for CI, then rerun this release workflow."
            exit 1
          fi
          gh run download "$run_id" --name Guoguo-iOS-unsigned --dir release-assets
          python3 scripts/release.py verify --artifacts release-assets
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py validate
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "果果 $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
