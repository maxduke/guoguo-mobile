name: Build and verify unsigned iOS package
description: Build the native core and app, then verify the package identity and checksums.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.4'
        channel: stable
        cache: true
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        cache-dependency-path: native/core/go.sum
    - run: scripts/setup_core.sh
      shell: bash
    - run: scripts/build_core.sh ios
      shell: bash
    - run: flutter config --no-enable-swift-package-manager
      shell: bash
    - run: python3 scripts/prepare_player.py
      shell: bash
    - run: flutter pub get
      shell: bash
    - name: Verify iOS player correction
      shell: bash
      run: |
        python3 scripts/prepare_ios_player.py
        swiftc patches/better_player_plus/GuoguoMediaPolicy.swift packages/guoguo_core/ios/guoguo_core/Sources/guoguo_core/AirPlayQueueState.swift scripts/test_player_policy.swift -o "$RUNNER_TEMP/player-policy-tests"
        "$RUNNER_TEMP/player-policy-tests"
        swiftc patches/better_player_plus/GuoguoSeekCoordinator.swift scripts/test_player_seek.swift -o "$RUNNER_TEMP/player-seek-tests"
        "$RUNNER_TEMP/player-seek-tests"
    - name: Prepare linked media libraries
      run: scripts/prepare_ios_media.sh
      shell: bash
    - run: flutter build ios --release --no-codesign
      shell: bash
    - name: Package and verify app identity
      shell: bash
      run: |
        python3 scripts/release.py package
        python3 scripts/release.py verify --artifacts build/release
